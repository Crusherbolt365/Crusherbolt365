name: Update combined contribution graph

on:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-combined-contribution-graph
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate combined contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          GRAPH_START_YEAR: "2023"
        run: python scripts/generate_combined_commits.py

      - name: Commit updated graph when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/combined-commits.svg assets/combined-commits.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh combined contribution graph"
            git push
          fi
